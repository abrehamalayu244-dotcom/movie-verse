<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <header class="header">
        <div class="left-content">
            <h1>Movie App</h1>
        </div>

        <div class="middle-content">
            <input type="text" placeholder="Search for a movie..." class="search-input">
        </div>
   <div class="right-content">
        <select id="type-select">
            <option value="all">All Genres</option>
            <option value="28">Action</option>
            <option value="12">Adventure</option>
            <option value="16">Animation</option>
            <option value="35">Comedy</option>
            <option value="80">Crime</option>
            <option value="99">Documentary</option>
            <option value="18">Drama</option>
            <option value="10751">Family</option>
            <option value="14">Fantasy</option>
            <option value="36">History</option>
            <option value="27">Horror</option>
            <option value="10402">Music</option>
            <option value="9648">Mystery</option>
            <option value="10749">Romance</option>
            <option value="878">Science Fiction</option>
            <option value="10770">TV Movie</option>
            <option value="53">Thriller</option>
            <option value="10752">War</option>
            <option value="37">Western</option>
</select>

            <select id="date">
                <option value="all">All Years</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
            </select>

    <select id="rating">
            <option value="all">Any Rating</option>
            <option value="8">8+ ⭐ Top Rated</option>
            <option value="5-7">5 - 7 ⭐</option>
            <option value="0-4">Below 5 ⭐</option>
</select>
        </div>
    </header>
<div class="movie-container">
            
</div>
<div id="movie-modal" class="modal hidden">
  <div class="modal-content">
    <button class="close-btn">&times;</button>
    <div id="modal-details">
      <!-- Detailed movie content will be injected here by JavaScript -->
    </div>
  </div>
</div>
<script src="scripts/script.js"></script>
</body>
</html>
